<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar pago</title>
</head>
<body>

    <h1>Registrar pago</h1>

    <div th:if="${error}">
        <p th:text="${error}"></p>
    </div>

    <div>
        <p>
            <strong>ID:</strong>
            <span th:text="${facturaForm.id}">1</span>
        </p>

        <p>
            <strong>Concepto:</strong>
            <span th:text="${facturaForm.concepto}">Alquiler mensual</span>
        </p>

        <p>
            <strong>Importe:</strong>
            <span th:text="${facturaForm.importe}">100000.00</span>
        </p>

        <p>
            <strong>Estado:</strong>
            <span th:text="${facturaForm.estado}">PENDIENTE</span>
        </p>
    </div>

    <form th:object="${facturaForm}"
          th:action="@{/facturas/{id}/pagar(id=${facturaForm.id})}"
          method="post">

        <input type="hidden" th:field="*{id}">
        <input type="hidden" th:field="*{contratoId}">
        <input type="hidden" th:field="*{concepto}">
        <input type="hidden" th:field="*{fechaEmision}">
        <input type="hidden" th:field="*{fechaVencimiento}">
        <input type="hidden" th:field="*{importe}">
        <input type="hidden" th:field="*{estado}">

        <div>
            <label for="fechaPago">Fecha de pago</label>
            <input type="date" id="fechaPago" th:field="*{fechaPago}">
        </div>

        <div>
            <label for="medioPago">Medio de pago</label>
            <select id="medioPago" th:field="*{medioPago}">
                <option value="">Seleccione un medio de pago</option>
                <option th:each="medio : ${mediosPago}"
                        th:value="${medio}"
                        th:text="${medio}">
                    EFECTIVO
                </option>
            </select>
        </div>

        <div>
            <label for="importePagado">Importe pagado</label>
            <input type="number" id="importePagado" th:field="*{importePagado}" step="0.01" min="0">
        </div>

        <div>
            <label for="interesPagado">Interés pagado</label>
            <input type="number" id="interesPagado" th:field="*{interesPagado}" step="0.01" min="0">
        </div>

        <div>
            <button type="submit">Registrar pago</button>
            <a th:href="@{/facturas}">Volver</a>
        </div>

    </form>

</body>
</html>
