<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${propiedadForm.id != null} ? 'Editar propiedad' : 'Nueva propiedad'"></title>
</head>
<body>

    <h1 th:text="${propiedadForm.id != null} ? 'Editar propiedad' : 'Nueva propiedad'"></h1>

    <div th:if="${error}">
        <p th:text="${error}"></p>
    </div>

    <!-- El action cambia según si es alta o edición -->
    <form th:action="${propiedadForm.id != null}
                ? @{/propiedades/{id}/editar(id=${propiedadForm.id})}
                : @{/propiedades/nueva}"
          th:object="${propiedadForm}"
          method="post">

        <!-- ID: solo lectura en edición (HU 1.3) -->
        <div th:if="${propiedadForm.id != null}">
            <label>ID de la propiedad:
                <input type="text" th:value="${propiedadForm.id}" readonly>
            </label>
            <br>
        </div>

        <div>
            <label>Dirección *:
                <input type="text" th:field="*{direccion}">
            </label>
            <span th:if="${#fields.hasErrors('direccion')}"
                  th:errors="*{direccion}"></span>
        </div>

        <div>
            <label>Ciudad *:
                <input type="text" th:field="*{ciudad}">
            </label>
            <span th:if="${#fields.hasErrors('ciudad')}"
                  th:errors="*{ciudad}"></span>
        </div>

        <div>
            <label>Tipo de propiedad *:
                <select th:field="*{tipo}">
                    <option value="">-- Seleccione --</option>
                    <option th:each="t : ${tiposPropiedad}"
                            th:value="${t}"
                            th:text="${t}"></option>
                </select>
            </label>
            <span th:if="${#fields.hasErrors('tipo')}"
                  th:errors="*{tipo}"></span>
        </div>

        <div>
            <label>Cantidad de ambientes *:
                <input type="number" th:field="*{ambientes}" min="1">
            </label>
            <span th:if="${#fields.hasErrors('ambientes')}"
                  th:errors="*{ambientes}"></span>
        </div>

        <div>
            <label>Metros cuadrados *:
                <input type="number" th:field="*{metrosCuadrados}" step="0.01" min="0.01">
            </label>
            <span th:if="${#fields.hasErrors('metrosCuadrados')}"
                  th:errors="*{metrosCuadrados}"></span>
        </div>

        <div>
            <label>Descripción *:
                <textarea th:field="*{descripcion}" rows="3" cols="50"></textarea>
            </label>
            <span th:if="${#fields.hasErrors('descripcion')}"
                  th:errors="*{descripcion}"></span>
        </div>

        <div>
            <label>Estado de disponibilidad *:
                <select th:field="*{estado}">
                    <option value="">-- Seleccione --</option>
                    <option th:each="e : ${estadosPropiedad}"
                            th:value="${e}"
                            th:text="${e}"></option>
                </select>
            </label>
            <span th:if="${#fields.hasErrors('estado')}"
                  th:errors="*{estado}"></span>
        </div>

        <!-- Propietario: lista seleccionable de personas no eliminadas (HU 1.1) -->
        <div>
            <label>Propietario *:
                <select th:field="*{propietarioId}">
                    <option value="">-- Seleccione --</option>
                    <option th:each="p : ${propietarios}"
                            th:value="${p.id}"
                            th:text="${p.nombre + ' ' + p.apellido}"></option>
                </select>
            </label>
            <span th:if="${#fields.hasErrors('propietarioId')}"
                  th:errors="*{propietarioId}"></span>
        </div>

        <div>
            <button type="submit"
                    th:text="${propiedadForm.id != null} ? 'Guardar cambios' : 'Registrar propiedad'">
            </button>
            <a th:href="@{/propiedades}">Cancelar</a>
        </div>

    </form>

</body>
</html>
