spring.application.name=02-BocchieriDiazLaggerDiaz
server.port=8081

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/02-BocchieriDiazLaggerDiaz?createDatabaseIfNotExist=true&serverTimezone=America/Argentina/Buenos_Aires}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Ejecuta data.sql despues de que Hibernate crea las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.mvc.format.date=iso
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Argentina/Buenos_Aires
